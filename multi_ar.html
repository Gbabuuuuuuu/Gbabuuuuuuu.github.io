<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supra AR • 3 ภาพ</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,sans-serif}
#ar-container{position:fixed;inset:0;overflow:hidden}
#status{position:fixed;z-index:10;top:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 64px);padding:12px 18px;border-radius:14px;background:rgba(9,25,45,.85);color:white;text-align:center;font-size:15px;line-height:1.6}
#start{position:fixed;z-index:11;bottom:44px;left:50%;transform:translateX(-50%);padding:14px 28px;border:0;border-radius:24px;color:#082437;background:#92e5ff;font:700 17px Tahoma,sans-serif;cursor:pointer}
#credit{position:fixed;z-index:10;bottom:8px;left:12px;right:12px;text-align:center;color:white;text-shadow:0 1px 4px black;font-size:10px}#credit a{color:inherit}[hidden]{display:none!important}
</style>
</head>
<body>
<div id="ar-container"></div>
<div id="status" role="status" aria-live="polite">กดเปิดกล้อง แล้วส่องรูปใดรูปหนึ่งจาก 3 รูป</div>
<button id="start">เปิดกล้อง AR</button>
<div id="credit"><a href="https://sketchfab.com/3d-models/toyota-supra-mk4-a80-61d402d6de904374bfe5a98907c85b1d" target="_blank" rel="noopener">Toyota Supra MK4 (A80) — temich</a> · <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

const status = document.getElementById('status');
const start = document.getElementById('start');
// These indices match the image order in targets-supra.mind.
const targets = [
  { label: 'ภาพที่ 1', aspect: 1 },
  { label: 'ภาพที่ 2', aspect: 600 / 900 },
  { label: 'ภาพที่ 3', aspect: 527 / 480 }
];
const mindar = new MindARThree({
  container: document.getElementById('ar-container'),
  imageTargetSrc: './targets-supra.mind',
  maxTrack: 3
});
const { renderer, scene, camera } = mindar;
const pmrem = new THREE.PMREMGenerator(renderer);
const room = new RoomEnvironment();
scene.environment = pmrem.fromScene(room, 0.04).texture;
room.dispose();
pmrem.dispose();
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(2, 4, 5);
scene.add(light);

const visibleTargets = new Set();
let modelPromise, modelFailed = false, modelReady = false, cameraReady = false;
function updateStatus() {
  if (!modelReady || modelFailed || !cameraReady) return;
  const labels = [...visibleTargets].sort().map(index => targets[index].label);
  status.textContent = labels.length
    ? `พบ: ${labels.join(', ')} • Toyota Supra`
    : 'ส่องรูปใดรูปหนึ่งจาก 3 รูป ให้เห็นครบทั้งภาพ';
}
const anchors = targets.map((target, index) => {
  const anchor = mindar.addAnchor(index);
  anchor.onTargetFound = () => { visibleTargets.add(index); updateStatus(); };
  anchor.onTargetLost = () => { visibleTargets.delete(index); updateStatus(); };
  return anchor;
});

async function loadModel() {
  const loader = new GLTFLoader();
  const gltf = await new Promise((resolve, reject) => {
    loader.load('./supra.glb', resolve, progress => {
      if (progress.total) status.textContent = `กำลังโหลดรถ ${Math.round(progress.loaded / progress.total * 100)}%`;
    }, reject);
  });
  // Share geometry and textures; download the car only once for all three targets.
  const placements = targets.map(target => {
    const model = gltf.scene.clone(true);
    const oriented = new THREE.Group();
    oriented.rotation.set(0.25, -0.65, 0);
    oriented.add(model);
    oriented.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(oriented);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const extent = Math.max(size.x, size.y / target.aspect, size.z);
    if (!Number.isFinite(extent) || extent <= 0) throw new Error('ขนาดโมเดลไม่ถูกต้อง');
    const centered = new THREE.Group();
    centered.position.copy(center).multiplyScalar(-1);
    centered.add(oriented);
    const placement = new THREE.Group();
    placement.scale.setScalar(0.95 / extent);
    placement.add(centered);
    return placement;
  });
  placements.forEach((placement, index) => anchors[index].group.add(placement));
  modelReady = true;
}
renderer.setAnimationLoop(() => renderer.render(scene, camera));
start.addEventListener('click', async () => {
  start.hidden = true;
  status.textContent = 'กำลังโหลดรถ…';
  try {
    if (!modelPromise) {
      modelFailed = false;
      modelPromise = loadModel().catch(error => {
        modelFailed = true;
        modelPromise = null;
        throw error;
      });
    }
    await modelPromise;
    status.textContent = 'กำลังเปิดกล้อง… กรุณาอนุญาตให้ใช้กล้อง';
    await mindar.start();
    cameraReady = true;
    updateStatus();
  } catch (error) {
    console.error(error);
    status.textContent = modelFailed
      ? 'โหลดรถไม่สำเร็จ กรุณาตรวจการเชื่อมต่อแล้วลองอีกครั้ง'
      : 'เปิด AR ไม่สำเร็จ กรุณาอนุญาตกล้องและเปิดผ่าน HTTPS';
    start.textContent = 'ลองอีกครั้ง';
    start.hidden = false;
  }
});
</script>
</body>
</html>
