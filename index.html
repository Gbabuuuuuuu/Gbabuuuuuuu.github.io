<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Ninja</title>

  <!-- บอก Browser ว่า "three" อยู่ที่ไหน -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    #status {
      position: fixed;
      z-index: 100;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      color: white;
      background: rgba(0,0,0,.7);
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>
<div id="status">กำลังเตรียม AR...</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
  "three/addons/loaders/GLTFLoader.js";

import { MindARThree } from
  "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


const status = document.getElementById("status");


const mindarThree = new MindARThree({
  container: document.querySelector("#ar-container"),
  imageTargetSrc: "./targets.mind"
});


const {
  renderer,
  scene,
  camera
} = mindarThree;


// แสง
const light = new THREE.HemisphereLight(
  0xffffff,
  0x444444,
  3
);

scene.add(light);


// Target
const anchor = mindarThree.addAnchor(0);


// ตัวละคร
let ninja = null;
let mixer = null;

const clock = new THREE.Clock();


// โหลด GLB
const loader = new GLTFLoader();

loader.load(
  "./ninja.glb",

  function (gltf) {

    console.log("NINJA GLB LOADED:", gltf);

    ninja = gltf.scene;

    ninja.scale.set(0.5, 0.5, 0.5);

    ninja.position.set(0, 0, 0);

    ninja.rotation.set(0, 0, 0);

    anchor.group.add(ninja);


    // เล่น Animation
    if (
      gltf.animations &&
      gltf.animations.length > 0
    ) {

      console.log(
        "Animations:",
        gltf.animations
      );

      mixer = new THREE.AnimationMixer(ninja);

      const animation = gltf.animations[0];

      console.log(
        "Playing animation:",
        animation.name
      );

      const action =
        mixer.clipAction(animation);

      action.play();
    }


    status.innerText =
      "โหลดนินจาแล้ว — ส่องไปที่รูป Target";

  },

  function (xhr) {

    if (xhr.total) {

      const percent =
        (xhr.loaded / xhr.total) * 100;

      console.log(
        "Loading ninja:",
        percent.toFixed(0) + "%"
      );

    }

  },

  function (error) {

    console.error(
      "ERROR LOADING ninja.glb:",
      error
    );

    status.innerText =
      "โหลด ninja.glb ไม่สำเร็จ";

  }
);


// เจอ Target
anchor.onTargetFound = function () {

  console.log("TARGET FOUND");

  status.innerText =
    "เจอ Target แล้ว!";

};


// หา Target ไม่เจอ
anchor.onTargetLost = function () {

  console.log("TARGET LOST");

  status.innerText =
    "ส่องกล้องไปที่รูป Target";

};


// Animation + Render
renderer.setAnimationLoop(function () {

  const delta =
    clock.getDelta();

  if (mixer) {
    mixer.update(delta);
  }

  renderer.render(
    scene,
    camera
  );

});


// เริ่ม AR
async function startAR() {

  try {

    status.innerText =
      "กำลังเปิดกล้อง...";

    await mindarThree.start();

    status.innerText =
      "ส่องกล้องไปที่รูป Target";

    console.log("AR STARTED");

  }

  catch (error) {

    console.error(
      "AR START ERROR:",
      error
    );

    status.innerText =
      "เปิดกล้องไม่ได้ กรุณาอนุญาต Camera";

  }

}


startAR();

</script>

</body>
</html>
