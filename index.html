<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Ninja</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    #message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 10px 18px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>
<div id="message">กำลังเปิดกล้อง...</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js";

import { MindARThree } from
"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


const message = document.getElementById("message");


/* =========================
   AR
========================= */

const mindarThree = new MindARThree({
  container: document.querySelector("#ar-container"),

  // รูป Target ของมึง
  imageTargetSrc: "./targets.mind"
});


const { renderer, scene, camera } = mindarThree;


/* =========================
   LIGHT
========================= */

const light = new THREE.HemisphereLight(
  0xffffff,
  0x444444,
  3
);

scene.add(light);


/* =========================
   TARGET
========================= */

const anchor = mindarThree.addAnchor(0);


/* =========================
   LOAD NINJA GLB
========================= */

const loader = new GLTFLoader();

loader.load(

  "./ninja.glb",

  function(gltf) {

    console.log("โหลด ninja.glb สำเร็จ");

    const ninja = gltf.scene;

    // ขนาดของนินจา
    ninja.scale.set(0.5, 0.5, 0.5);

    // ตำแหน่งบน Target
    ninja.position.set(0, 0, 0);

    // หมุนโมเดลถ้าจำเป็น
    ninja.rotation.set(0, 0, 0);

    anchor.group.add(ninja);


    /* =========================
       ANIMATION
    ========================= */

    if (gltf.animations && gltf.animations.length > 0) {

      const mixer = new THREE.AnimationMixer(ninja);

      const action =
        mixer.clipAction(gltf.animations[0]);

      action.play();


      const clock = new THREE.Clock();

      renderer.setAnimationLoop(() => {

        const delta = clock.getDelta();

        mixer.update(delta);

        renderer.render(scene, camera);

      });

    } else {

      renderer.setAnimationLoop(() => {

        renderer.render(scene, camera);

      });

    }

    message.innerText = "ส่องไปที่รูปมอนสเตอร์สีฟ้า";

  },

  undefined,

  function(error) {

    console.error("โหลด ninja.glb ไม่สำเร็จ:", error);

    message.innerText =
      "โหลด ninja.glb ไม่สำเร็จ";

  }

);


/* =========================
   TARGET FOUND
========================= */

anchor.onTargetFound = () => {

  console.log("เจอ Target");

  message.innerText =
    "เจอ Target แล้ว!";

};


/* =========================
   TARGET LOST
========================= */

anchor.onTargetLost = () => {

  console.log("ไม่เจอ Target");

  message.innerText =
    "ส่องกล้องไปที่รูปมอนสเตอร์สีฟ้า";

};


/* =========================
   START AR
========================= */

try {

  await mindarThree.start();

  renderer.setAnimationLoop(() => {

    renderer.render(scene, camera);

  });

} catch (error) {

  console.error(error);

  message.innerText =
    "เปิดกล้องไม่ได้";

}

</script>

</body>
</html>
