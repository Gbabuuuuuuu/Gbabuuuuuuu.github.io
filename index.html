<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Ninja</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    #status {
      position: fixed;
      z-index: 100;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      padding: 10px 18px;

      color: white;
      background: rgba(0, 0, 0, 0.7);

      border-radius: 10px;

      font-family: Arial, sans-serif;
      font-size: 16px;

      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="ar-container"></div>

  <div id="status">
    กำลังเตรียม AR...
  </div>


  <script type="module">

    /* =========================================
       IMPORT
    ========================================= */

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js";

    import { GLTFLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js";

    import { MindARThree } from
      "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


    /* =========================================
       STATUS
    ========================================= */

    const status = document.getElementById("status");


    /* =========================================
       MINDAR
    ========================================= */

    const mindarThree = new MindARThree({

      container: document.querySelector("#ar-container"),

      /*
        Target ของงานมึง
      */
      imageTargetSrc: "./targets.mind"

    });


    const {
      renderer,
      scene,
      camera
    } = mindarThree;


    /* =========================================
       LIGHT
    ========================================= */

    const ambientLight = new THREE.HemisphereLight(
      0xffffff,
      0x444444,
      3
    );

    scene.add(ambientLight);


    /* =========================================
       TARGET ANCHOR
    ========================================= */

    const anchor = mindarThree.addAnchor(0);


    /* =========================================
       VARIABLES
    ========================================= */

    let ninja = null;

    let mixer = null;

    const clock = new THREE.Clock();


    /* =========================================
       LOAD NINJA MODEL
    ========================================= */

    const loader = new GLTFLoader();


    loader.load(

      /*
        สำคัญ:
        ต้องเป็นไฟล์นินจาของมึง
      */
      "./ninja.glb",


      /* =======================================
         LOAD SUCCESS
      ======================================= */

      function(gltf) {

        console.log("NINJA GLB LOADED:", gltf);

        ninja = gltf.scene;


        /*
          ขนาดโมเดล
        */
        ninja.scale.set(
          0.5,
          0.5,
          0.5
        );


        /*
          ตำแหน่งโมเดลบน Target
        */
        ninja.position.set(
          0,
          0,
          0
        );


        /*
          หมุนโมเดล
        */
        ninja.rotation.set(
          0,
          0,
          0
        );


        /*
          เพิ่มนินจาเข้า Anchor
        */
        anchor.group.add(ninja);


        /* =====================================
           ANIMATION
        ===================================== */

        if (gltf.animations && gltf.animations.length > 0) {

          console.log(
            "Animations:",
            gltf.animations
          );


          /*
            ไฟล์นินจาของมึงมี Animation
            ใช้ Animation แรก
          */
          mixer = new THREE.AnimationMixer(ninja);


          const animation =
            gltf.animations[0];


          console.log(
            "Playing animation:",
            animation.name
          );


          const action =
            mixer.clipAction(animation);


          action.play();

        }


        status.innerText =
          "โหลดนินจาแล้ว — ส่องไปที่รูป Target";


      },


      /* =======================================
         LOAD PROGRESS
      ======================================= */

      function(xhr) {

        if (xhr.total) {

          const percent =
            (xhr.loaded / xhr.total) * 100;

          console.log(
            "Loading ninja:",
            percent.toFixed(0) + "%"
          );

        }

      },


      /* =======================================
         LOAD ERROR
      ======================================= */

      function(error) {

        console.error(
          "ERROR LOADING ninja.glb:",
          error
        );

        status.innerText =
          "โหลด ninja.glb ไม่สำเร็จ";

      }

    );


    /* =========================================
       TARGET FOUND
    ========================================= */

    anchor.onTargetFound = function() {

      console.log(
        "TARGET FOUND"
      );

      status.innerText =
        "เจอ Target แล้ว!";

    };


    /* =========================================
       TARGET LOST
    ========================================= */

    anchor.onTargetLost = function() {

      console.log(
        "TARGET LOST"
      );

      status.innerText =
        "ส่องกล้องไปที่รูป Target";

    };


    /* =========================================
       ANIMATION LOOP
    ========================================= */

    renderer.setAnimationLoop(function() {

      const delta =
        clock.getDelta();


      /*
        อัปเดต Animation ของนินจา
      */
      if (mixer) {

        mixer.update(delta);

      }


      /*
        แสดง AR
      */
      renderer.render(
        scene,
        camera
      );

    });


    /* =========================================
       START AR
    ========================================= */

    async function startAR() {

      try {

        status.innerText =
          "กำลังเปิดกล้อง...";


        await mindarThree.start();


        status.innerText =
          "ส่องกล้องไปที่รูป Target";


        console.log(
          "AR STARTED"
        );

      }

      catch (error) {

        console.error(
          "AR START ERROR:",
          error
        );

        status.innerText =
          "เปิดกล้องไม่ได้ กรุณาอนุญาต Camera";

      }

    }


    /* =========================================
       START
    ========================================= */

    startAR();

  </script>

</body>
</html>
