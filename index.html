<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Ninja</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #ar-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      z-index: 100;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      color: white;
      background: rgba(0,0,0,.7);
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="ar-container"></div>
<div id="status">กำลังเตรียม AR...</div>

<script type="module">

import * as THREE from "three";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
  MindARThree
} from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";


const status = document.getElementById("status");


// ==============================
// MindAR
// ==============================

const mindarThree = new MindARThree({
  container: document.querySelector("#ar-container"),
  imageTargetSrc: "./targets.mind"
});

const {
  renderer,
  scene,
  camera
} = mindarThree;


// ==============================
// แสง
// ==============================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    4
  )
);

const light = new THREE.DirectionalLight(
  0xffffff,
  3
);

light.position.set(2, 4, 5);

scene.add(light);


// ==============================
// Target
// ==============================

const anchor = mindarThree.addAnchor(0);


// ==============================
// ตัวแปร
// ==============================

let ninja = null;
let mixer = null;

const clock = new THREE.Clock();


// ==============================
// โหลด Ninja
// ==============================

const loader = new GLTFLoader();

loader.load(

  "./ninja.glb",

  function(gltf) {

    console.log("===== NINJA LOADED =====");
    console.log(gltf);

    ninja = gltf.scene;


    // --------------------------------
    // ทำให้ทุก Mesh แสดงผล
    // --------------------------------

    ninja.traverse(function(object) {

      if (object.isMesh) {

        object.visible = true;

        object.frustumCulled = false;

        if (object.material) {

          if (Array.isArray(object.material)) {

            object.material.forEach(function(mat) {
              mat.side = THREE.DoubleSide;
            });

          } else {

            object.material.side =
              THREE.DoubleSide;

          }

        }

      }

    });


    // --------------------------------
    // หา Bounding Box
    // --------------------------------

    const box =
      new THREE.Box3().setFromObject(ninja);

    const size =
      box.getSize(new THREE.Vector3());

    const center =
      box.getCenter(new THREE.Vector3());


    console.log("NINJA SIZE:", size);
    console.log("NINJA CENTER:", center);


    // --------------------------------
    // ปรับขนาด
    // --------------------------------

    const maxSize = Math.max(
      size.x,
      size.y,
      size.z
    );

    const targetSize = 0.8;

    const scale =
      targetSize / maxSize;

    ninja.scale.setScalar(scale);


    // --------------------------------
    // สำคัญ:
    // คำนวณตำแหน่งใหม่หลัง Scale
    // --------------------------------

    ninja.position.set(
      -center.x * scale,
      -center.y * scale,
      -center.z * scale
    );


    console.log(
      "NINJA SCALE:",
      scale
    );

    console.log(
      "NINJA POSITION:",
      ninja.position
    );


    // --------------------------------
    // เพิ่มเข้า Target
    // --------------------------------

    anchor.group.add(ninja);


    // --------------------------------
    // Animation
    // --------------------------------

    if (
      gltf.animations &&
      gltf.animations.length > 0
    ) {

      console.log(
        "Animation:",
        gltf.animations[0].name
      );

      mixer =
        new THREE.AnimationMixer(ninja);

      const action =
        mixer.clipAction(
          gltf.animations[0]
        );

      action.reset();

      action.play();

    }


    status.innerText =
      "โหลดนินจาแล้ว — ส่องไปที่รูป Target";

  },


  // Loading
  function(xhr) {

    if (xhr.total) {

      const percent =
        (xhr.loaded / xhr.total) * 100;

      console.log(
        "Ninja loading:",
        percent.toFixed(0) + "%"
      );

    }

  },


  // Error
  function(error) {

    console.error(
      "NINJA ERROR:",
      error
    );

    status.innerText =
      "โหลด ninja.glb ไม่สำเร็จ";

  }

);


// ==============================
// Target เจอ
// ==============================

anchor.onTargetFound = function() {

  console.log("TARGET FOUND");

  status.innerText =
    "เจอ Target แล้ว!";

};


// ==============================
// Target หาย
// ==============================

anchor.onTargetLost = function() {

  console.log("TARGET LOST");

  status.innerText =
    "ส่องกล้องไปที่รูป Target";

};


// ==============================
// Render + Animation
// ==============================

renderer.setAnimationLoop(function() {

  const delta =
    clock.getDelta();

  if (mixer) {
    mixer.update(delta);
  }

  renderer.render(
    scene,
    camera
  );

});


// ==============================
// Start AR
// ==============================

async function startAR() {

  try {

    status.innerText =
      "กำลังเปิดกล้อง...";

    await mindarThree.start();

    status.innerText =
      "ส่องกล้องไปที่รูป Target";

    console.log("AR STARTED");

  }

  catch(error) {

    console.error(
      "AR START ERROR:",
      error
    );

    status.innerText =
      "เปิดกล้องไม่ได้";

  }

}

startAR();

</script>

</body>
</html>
