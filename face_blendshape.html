<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gbabu Face Blendshape</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }
}
</script>

<style>
html,body {
  margin:0;
  height:100%;
  overflow:hidden;
  background:#171329;
  color:white;
  font-family:sans-serif;
}
#view {
  position:fixed;
  inset:0;
  overflow:hidden;
}
#panel {
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:20;
  background:#171329dc;
  border-radius:16px;
  padding:12px;
  text-align:center;
}
#status {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:14px;
}
#scores {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
  margin-top:8px;
}
#scores span {
  background:#ffffff16;
  border-radius:8px;
  padding:5px;
  font-size:11px;
}
#start {
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:15px 25px;
  border:0;
  border-radius:30px;
  background:#ffb83e;
  color:#171329;
  font-size:18px;
  font-weight:bold;
}
#start:disabled {
  opacity:.5;
}
</style>
</head>

<body>
<div id="view"></div>

<div id="panel">
  <div id="status">
    Gbabu — หัวหูฟังสีส้ม
    กดเปิดกล้อง แล้วอนุญาตให้ใช้กล้อง
  </div>
  <div id="scores"></div>
</div>

<button id="start">เปิดกล้อง</button>

<script>
const info = document.querySelector('#status');
const stats = document.querySelector('#scores');
const button = document.querySelector('#start');

let ar;
let busy = false;

window.addEventListener('error', e => {
  info.textContent = 'ผิดพลาด: ' + e.message;
});

window.addEventListener('unhandledrejection', e => {
  info.textContent =
    'ผิดพลาด: ' + String(e.reason?.message || e.reason);
});

// ถ้าโหลดนานเกินไป ให้แสดงข้อความ
async function limited(promise, message) {
  let timer;

  try {
    return await Promise.race([
      promise,
      new Promise((_, reject) => {
        timer = setTimeout(
          () => reject(new Error(message)),
          45000
        );
      })
    ]);
  } finally {
    clearTimeout(timer);
  }
}

button.onclick = async () => {
  if (busy) return;

  busy = true;
  button.disabled = true;
  let stage = 'โหลดระบบ';

  try {
    if (!isSecureContext) {
      throw new Error('เปิดด้วยลิงก์ HTTPS เท่านั้น');
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        'ลองเปิดใน Safari หรือ Chrome โดยตรง'
      );
    }

    info.textContent = 'กำลังโหลดระบบ…';

    const [THREE, {GLTFLoader}, {MindARThree}] =
      await limited(
        Promise.all([
          import('three'),
          import('three/addons/loaders/GLTFLoader.js'),
          import('mindar-face-three')
        ]),
        'โหลดระบบไม่สำเร็จ ตรวจอินเทอร์เน็ต'
      );

    // โหลดหัวของคุณ
    stage = 'โหลดหัว gbabu_face.glb';
    info.textContent = 'กำลังโหลดหัวของคุณ…';

    const model = await limited(
      new GLTFLoader().loadAsync('./gbabu_face.glb'),
      'โหลดหัวนานเกินไป ตรวจไฟล์ gbabu_face.glb'
    );

    // ค้นหาชิ้นส่วนที่มี Blendshape
    const faces = [];

    model.scene.traverse(obj => {
      if (
        obj.isMesh &&
        obj.morphTargetDictionary &&
        obj.morphTargetInfluences
      ) {
        faces.push(obj);
      }
    });

    if (!faces.length) {
      throw new Error('โมเดลนี้ไม่มีรูปร่างสีหน้า');
    }

    ar = new MindARThree({
      container: document.querySelector('#view')
    });

    const {scene, renderer, camera} = ar;

    // แสงสำหรับโมเดล
    scene.add(
      new THREE.HemisphereLight(
        0xffffff,
        0x575070,
        2
      )
    );

    const lamp =
      new THREE.DirectionalLight(0xffffff, 2);

    lamp.position.set(-2, 3, 5);
    scene.add(lamp);

    // เพิ่มเลขให้หัวใหญ่ขึ้น ลดเลขให้เล็กลง
    model.scene.scale.setScalar(1);

    // ยึดหัวไว้กับตำแหน่งใบหน้า
    ar.addAnchor(1).group.add(model.scene);

    stage = 'เปิดกล้องและโหลดตัวตรวจจับใบหน้า';
    info.textContent =
      'อนุญาตกล้อง แล้วรอโหลดตัวตรวจจับใบหน้า…';

    await ar.start();
    button.hidden = true;

    const smooth = {};
    let frame = 0;

    renderer.setAnimationLoop(() => {
      try {
        const estimate = ar.getLatestEstimate();

        const categories =
          estimate?.blendshapes?.categories;

        model.scene.visible = !!estimate;

        if (categories) {
          const values = Object.fromEntries(
            categories.map(c => [
              c.categoryName,
              c.score
            ])
          );

          // เตรียมค่าของทุกสีหน้าในโมเดล
          for (const face of faces) {
            for (const name of Object.keys(
              face.morphTargetDictionary
            )) {
              const target = Math.max(
                0,
                Math.min(1, values[name] || 0)
              );

              if (smooth[name] === undefined) {
                smooth[name] = target;
              }
            }
          }

          // ทำให้การขยับนุ่มขึ้น
          for (const name of Object.keys(smooth)) {
            const target = Math.max(
              0,
              Math.min(1, values[name] || 0)
            );

            smooth[name] +=
              (target - smooth[name]) * .55;
          }

          // จับคู่ชื่อค่าจากกล้องกับชื่อสีหน้าในโมเดล
          for (const face of faces) {
            for (const [name, index] of Object.entries(
              face.morphTargetDictionary
            )) {
              face.morphTargetInfluences[index] =
                smooth[name] || 0;
            }
          }

          // แสดงค่าครบ 5 หัวข้อตามงาน
          if (frame++ % 10 === 0) {
            const s = name => values[name] || 0;

            const items = {
              eyeBlink: Math.max(
                s('eyeBlinkLeft'),
                s('eyeBlinkRight')
              ),

              mouthOpen: s('jawOpen'),

              smile: (
                s('mouthSmileLeft') +
                s('mouthSmileRight')
              ) / 2,

              frown: (
                s('mouthFrownLeft') +
                s('mouthFrownRight')
              ) / 2,

              eyes: Math.max(
                ...Object.entries(values)
                  .filter(([key]) =>
                    key.startsWith('eyeLook')
                  )
                  .map(([, value]) => value),
                0
              )
            };

            info.textContent =
              'ลองกะพริบตา อ้าปาก ยิ้ม ปากคว่ำ และมองซ้าย–ขวา';

            stats.replaceChildren(
              ...Object.entries(items).map(
                ([name, value]) => {
                  const span =
                    document.createElement('span');

                  span.textContent =
                    name + ' ' +
                    Math.round(value * 100) + '%';

                  return span;
                }
              )
            );
          }

        } else {
          info.textContent = estimate
            ? 'พบหน้า แต่ยังไม่ได้ค่าสีหน้า'
            : 'ให้กล้องเห็นใบหน้าในที่สว่าง';

          stats.textContent = '';
        }

        renderer.render(scene, camera);

      } catch (error) {
        renderer.setAnimationLoop(null);

        info.textContent =
          'ขณะขยับหน้า: ' + error.message +
          ' — รีเฟรชเพื่อลองใหม่';
      }
    });

  } catch (error) {
    console.error(error);

    if (ar) {
      try {
        ar.renderer.setAnimationLoop(null);
        ar.stop();
        ar.renderer.dispose();
      } catch {}

      ar = null;
    }

    document.querySelector('#view').replaceChildren();

    info.textContent =
      error.name === 'NotAllowedError'
        ? 'กล้องไม่ได้รับอนุญาต เปิดสิทธิ์กล้องแล้วลองใหม่'
        : 'ติดที่: ' + stage + '\n' +
          (error.message || String(error));

    busy = false;
    button.disabled = false;
    button.textContent = 'ลองอีกครั้ง';
  }
};
</script>
</body>
</html>
