<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>ลายหน้าสุดเฟี้ยว</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    #container {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      padding: 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      text-align: center;
      font-size: 15px;
      pointer-events: none;
    }

    #start {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 15px 28px;
      border: 0;
      border-radius: 30px;
      background: #ffdf00;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #start:disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="status">กดปุ่มด้านล่างเพื่อเปิดกล้อง</div>
  <button id="start">เปิดกล้อง</button>

  <script type="module">
    const status = document.querySelector("#status");
    const button = document.querySelector("#start");

    let ar;
    let busy = false;

    button.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      button.disabled = true;

      try {
        status.textContent = "กำลังโหลดระบบและลายหน้า…";

        const THREE = await import("three");
        const { MindARThree } = await import("mindar-face-three");

        // โหลดรูปชื่อ download.png ที่อยู่ข้างไฟล์ HTML
        const texture = await new THREE.TextureLoader().loadAsync(
          "./download.png"
        );
        texture.colorSpace = THREE.SRGBColorSpace;

        ar = new MindARThree({
          container: document.querySelector("#container")
        });

        const { renderer, scene, camera } = ar;
        const face = ar.addFaceMesh();

        // ใช้วัสดุที่แสดงสีภาพตรง ๆ และรองรับพื้นหลังโปร่งใส
        face.material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        scene.add(face);

        status.textContent = "กรุณาอนุญาตให้ใช้กล้อง";
        await ar.start();

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        button.hidden = true;
        status.textContent = "ให้กล้องเห็นใบหน้า แล้วลองหันซ้าย–ขวา";
      } catch (error) {
        console.error(error);

        if (ar) {
          try { ar.stop(); } catch {}
          try { ar.renderer.dispose(); } catch {}
          document.querySelector("#container").replaceChildren();
          ar = null;
        }

        const name = error?.name;

        if (name === "NotAllowedError") {
          status.textContent =
            "กล้องไม่ได้รับอนุญาต ให้เปิดสิทธิ์กล้องแล้วลองใหม่";
        } else if (name === "NotFoundError") {
          status.textContent = "ไม่พบกล้องในอุปกรณ์นี้";
        } else {
          status.textContent =
            "โหลดไม่สำเร็จ ตรวจว่ามี download.png อยู่ข้าง face_texture.html และอินเทอร์เน็ตใช้งานได้";
        }

        button.textContent = "ลองอีกครั้ง";
        button.disabled = false;
        busy = false;
      }
    });
  </script>
</body>
</html>
